name: 'CI Check & Cache Warmer'

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  check:
    name: Check & Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          # Linux 需 24.04+：xcap -> pipewire 0.10 的 bindgen 依赖新版 SPA 头文件，
          # 22.04 的 PipeWire 0.3.48 中相关函数还是宏，生成的绑定缺函数导致编译失败
          - ubuntu-24.04
          - windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libpipewire-0.3-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Configure sccache & Rust flags
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # 仓库存在历史 clippy warnings，暂不加 -D warnings；
      # 清理后可升级为 cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace